services:

  # =========================================================
  # API GATEWAY
  # =========================================================

  api-gateway:
    build:
      context: ./api-gateway
    container_name: saas-api-gateway
    ports:
      - "5000:5000"
    env_file:
      - ./api-gateway/.env.docker
    depends_on:
      - auth
      - tenant
      - user
      - fund
      - expenditure
      - payment
      - payment-method
      - subscription
      - report
      - audit
      - admin
    restart: unless-stopped


  # =========================================================
  # AUTH SERVICE
  # =========================================================

  auth:
    build:
      context: ./services/ms-01-auth-service
    container_name: saas-auth
    env_file:
      - ./services/ms-01-auth-service/.env
    expose:
      - "5001"
    restart: unless-stopped


  # =========================================================
  # TENANT SERVICE
  # =========================================================

  tenant:
    build:
      context: ./services/ms-02-tenant-service
    container_name: saas-tenant
    env_file:
      - ./services/ms-02-tenant-service/.env
    expose:
      - "5002"
    restart: unless-stopped


  # =========================================================
  # USER SERVICE
  # =========================================================

  user:
    build:
      context: ./services/ms-03-user-service
    container_name: saas-user
    env_file:
      - ./services/ms-03-user-service/.env
    expose:
      - "5003"
    restart: unless-stopped


  # =========================================================
  # FUND SERVICE
  # =========================================================

  fund:
