      context: ./services/ms-04-fund-service
    container_name: saas-fund
    env_file:
      - ./services/ms-04-fund-service/.env
    expose:
      - "5004"
    restart: unless-stopped


  # =========================================================
  # EXPENDITURE SERVICE
  # =========================================================

  expenditure:
    build:
      context: ./services/ms-05-expenditure-service
    container_name: saas-expenditure
    env_file:
      - ./services/ms-05-expenditure-service/.env
    expose:
      - "5005"
    restart: unless-stopped


  # =========================================================
  # PAYMENT SERVICE
  # =========================================================

  payment:
    build:
      context: ./services/ms-06-payment-service
    container_name: saas-payment
    env_file:
      - ./services/ms-06-payment-service/.env
    expose:
      - "5006"
    restart: unless-stopped


  # =========================================================
  # PAYMENT METHOD SERVICE
  # =========================================================

  payment-method:
